name: Release

# Publishing happens ONLY here, and ONLY when a `v*` release tag is pushed:
# multi-arch image (amd64+arm64) to GHCR with semver + latest + sha- tags,
# cosign-signed, plus a GitHub Release. Plain pushes to main never publish
# anything.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Each tag gets its own group - a real release build should never be
  # cancelled mid-push by another one, so this only guards against the same
  # tag somehow being pushed twice.
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: Build & push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless signing
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      - name: Lowercase repository owner
        run: echo "REPO_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "${GITHUB_ENV}"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ env.REPO_OWNER }}/riffado-mcp
          tags: |
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: sigstore/cosign-installer@v3
      - name: Sign image (keyless)
        run: |
          cosign sign --yes "ghcr.io/${REPO_OWNER}/riffado-mcp@${{ steps.build.outputs.digest }}"

  github-release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [image]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: tag_message
        name: Read annotated tag message
        run: |
          {
            echo 'body<<EOF'
            git tag -l --format='%(contents)' "${GITHUB_REF_NAME}"
            echo EOF
          } >> "${GITHUB_OUTPUT}"

      - uses: softprops/action-gh-release@v3
        with:
          body: ${{ steps.tag_message.outputs.body }}
          append_body: true
          generate_release_notes: true
