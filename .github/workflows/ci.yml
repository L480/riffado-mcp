name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (eslint + prettier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  typecheck:
    name: Typecheck (tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    name: Test (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npx vitest run --coverage
      - if: matrix.node-version == 22
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  integration:
    name: Integration (real Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: riffado_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/riffado_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:integration

  docker:
    name: Docker build (smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: riffado-mcp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run -d --name riffado-mcp-ci \
            --read-only --cap-drop=ALL --security-opt no-new-privileges \
            -p 3000:3000 \
            -e DATABASE_URL="postgresql://postgres:postgres@localhost:5432/riffado" \
            -e ENCRYPTION_KEY="$(printf 'a%.0s' $(seq 1 64))" \
            -e HTTP_AUTH_TOKEN="ci-smoke-test-token" \
            riffado-mcp:ci
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:3000/health; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:3000/health
          test "$(docker exec riffado-mcp-ci id -u)" = "7333"
          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:3000/mcp \
            -H 'Content-Type: application/json' -d '{}')
          test "$status" = "401"
          docker logs riffado-mcp-ci
          docker rm -f riffado-mcp-ci

  hadolint:
    name: Hadolint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile

  trivy:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: sarif
          output: trivy-results.sarif
      # Code scanning (SARIF upload) needs a public repo or GitHub Advanced
      # Security; on a private repo without GHAS the upload fails with
      # "Resource not accessible by integration". The scan itself still runs
      # and still fails the job on HIGH/CRITICAL via exit-code above.
      - if: always() && !github.event.repository.private
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
