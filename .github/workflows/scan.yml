name: Scheduled image scan

# Nightly scan of the published `:latest` image so a newly-disclosed
# base-image CVE surfaces without needing a new commit.
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trivy-image:
    name: Trivy image scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Lowercase repository owner
        run: echo "REPO_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "${GITHUB_ENV}"
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ env.REPO_OWNER }}/riffado-mcp:latest
          severity: HIGH,CRITICAL
          # Debian/Alpine security fixes lag upstream disclosure for many
          # packages, so without this Trivy floods Code Scanning with CVEs
          # that have no available fix yet. This keeps the alert list to
          # things we can actually act on.
          ignore-unfixed: true
          format: sarif
          output: trivy-image-results.sarif
      # See ci.yml: SARIF upload needs a public repo or GHAS.
      - if: always() && !github.event.repository.private
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-image-results.sarif
